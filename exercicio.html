<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container py-3">

        <!-- Linha 1 -->
        <div class="row g-3 mb-3">
            <div class="col-12 col-md-3 bg-danger-subtle border border-danger rounded p-3"></div>
            <div class="col-12 col-md-9 bg-primary-subtle border border-primary rounded p-3"></div>
        </div>

        <!-- Linha 2 -->
        <div class="row g-3 mb-3">
            <div class="col-12 col-md-6 col-lg-4 bg-info-subtle border border-info rounded p-3"></div>
            <div class="col-12 col-md-6 col-lg-4 bg-info-subtle border border-info rounded p-3"></div>
            <div class="col-12 col-md-6 col-lg-4 bg-info-subtle border border-info rounded p-3"></div>
        </div>

        <!-- Linha 3 -->
        <div class="row g-3">
            <div class="col-12 bg-success-subtle border border-success rounded p-3"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
